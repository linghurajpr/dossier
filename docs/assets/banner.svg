<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Dossier</title>
  <desc id="d">Dossier: agent-native case processing. Pipeline of Intake, Verify, Approve and Action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#151B3D"/>
      <stop offset="1" stop-color="#1B1147"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.35" stop-color="#6366F1"/>
      <stop offset="0.7" stop-color="#10B981"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#glowA)"/>
  <rect width="1280" height="340" rx="20" fill="url(#glowB)"/>
  <rect x="0" y="332" width="1280" height="8" rx="4" fill="url(#line)"/>

  <!-- title block -->
  <text x="72" y="148" font-family="'Space Grotesk','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="url(#title)">Dossier</text>
  <text x="76" y="196" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="500" fill="#E6EAF7">Agent-native case processing for regulated teams</text>
  <text x="76" y="236" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" fill="#8B95B7">messy documents in  ·  verified, auditable decisions out</text>

  <!-- pill tags -->
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" font-weight="600">
    <rect x="76" y="262" width="150" height="30" rx="15" fill="#6366F1" fill-opacity="0.22" stroke="#6366F1"/>
    <text x="151" y="282" text-anchor="middle" fill="#C7C9FF">Cominty SDK</text>
    <rect x="236" y="262" width="150" height="30" rx="15" fill="#10B981" fill-opacity="0.2" stroke="#10B981"/>
    <text x="311" y="282" text-anchor="middle" fill="#A7F3D0">Human-in-loop</text>
    <rect x="396" y="262" width="150" height="30" rx="15" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B"/>
    <text x="471" y="282" text-anchor="middle" fill="#FDE68A">Audit trail</text>
  </g>

  <!-- pipeline graphic -->
  <g transform="translate(650,0)" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="15" font-weight="600">
    <path d="M60 170 H190 M270 170 H400 M480 170 H510" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" fill="none"/>

    <circle cx="60" cy="170" r="52" fill="#22D3EE" opacity="0.25" filter="url(#soft)"/>
    <circle cx="60" cy="170" r="38" fill="#0B1020" stroke="#22D3EE" stroke-width="3"/>
    <text x="60" y="176" text-anchor="middle" fill="#A5F3FC">Intake</text>

    <circle cx="230" cy="170" r="52" fill="#A855F7" opacity="0.25" filter="url(#soft)"/>
    <circle cx="230" cy="170" r="38" fill="#0B1020" stroke="#A855F7" stroke-width="3"/>
    <text x="230" y="176" text-anchor="middle" fill="#E9D5FF">Verify</text>

    <circle cx="400" cy="170" r="52" fill="#F59E0B" opacity="0.25" filter="url(#soft)"/>
    <circle cx="400" cy="170" r="38" fill="#0B1020" stroke="#F59E0B" stroke-width="3"/>
    <text x="400" y="176" text-anchor="middle" fill="#FDE68A">Approve</text>

    <circle cx="540" cy="170" r="52" fill="#10B981" opacity="0.25" filter="url(#soft)"/>
    <circle cx="540" cy="170" r="38" fill="#0B1020" stroke="#10B981" stroke-width="3"/>
    <text x="540" y="176" text-anchor="middle" fill="#A7F3D0">Act</text>

    <!-- error flag -->
    <g transform="translate(212,96)">
      <rect width="104" height="30" rx="8" fill="#F43F5E" fill-opacity="0.18" stroke="#F43F5E"/>
      <text x="52" y="20" text-anchor="middle" font-size="12" fill="#FECDD3">ADDRESS_MISMATCH</text>
    </g>
    <path d="M264 126 L240 134" stroke="#F43F5E" stroke-width="2" stroke-linecap="round"/>

    <text x="300" y="262" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#8B95B7">3 Cominty agents · 1 human gate · 100% audited</text>
  </g>
</svg>
